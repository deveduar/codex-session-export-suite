[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-exporter"
version = "2.1.0"
description = "Extract and export Codex conversation sessions from VS Code"
requires-python = ">=3.8"

[project.scripts]
codex_export = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "extract", "output", "products"]
