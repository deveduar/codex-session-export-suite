[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-exporter"
version = "2.0.0"
description = "Extract and export Codex conversation sessions from VS Code"
requires-python = ">=3.8"

[project.scripts]
codex_export = "codex_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli.py", "extract.py", "output.py", "products.py", "__init__.py"]