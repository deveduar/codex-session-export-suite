# Configuración por defecto de codex_export.
#
# Precedencia: argumentos de la CLI > este archivo > valores internos.
#
# También se puede crear una configuración por usuario:
#   Windows: %APPDATA%\codex_exporter\config.ini
#   Linux:   ~/.config/codex_exporter/config.ini
#
# Y se puede indicar otro archivo con: codex_export --config ruta.ini

[codex]
# Carpeta raíz de Codex, carpeta sessions, subcarpeta de año/mes o un .jsonl.
# Ejemplos:
#   dir = ~/.codex
#   dir = %USERPROFILE%\.codex
#   dir = %USERPROFILE%\.codex\sessions\2026
dir = ~/.codex

[output]
# Carpeta donde se guardan los exports.
dir = ./codex_exports

[export]
# transcript, memory, digest, faithful o un preset (archive, notes, prompts...).
preset = transcript
# user, assistant o both. Vacío = sin filtro.
role =
# Truncar el texto a N caracteres. Vacío = sin truncar.
truncate =
# Mostrar timestamps en la salida (true/false).
timestamps = true
