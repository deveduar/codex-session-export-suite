# Default configuration for Codex Extension Exporter.
#
# Precedence: CLI arguments > this file > built-in defaults.
#
# A per-user config can also be created at:
#   Windows: %APPDATA%\codex_exporter\config.ini
#   Linux:   ~/.config/codex_exporter/config.ini
#
# Use another file with: python3 cli.py --config path/to/config.ini

[codex]
# Codex root directory, sessions directory, year/month subdirectory, or a .jsonl file.
# Leave empty to auto-detect CODEX_HOME or ~/.codex.
# Windows example: dir = %USERPROFILE%\.codex
dir =

[output]
# Directory where exported files are written.
dir = ./codex_exports

[export]
# Default preset. Leave empty to use the transcript product.
# Presets: archive, quick, study, review, notes, conversation, prompts, rag, digest
preset =
# Explicit products, separated by commas or spaces.
# Products: transcript, memory, faithful, digest
# Example: products = transcript memory
products =
# Role filter: user, assistant, or both. Leave empty for no filter.
role =
# Truncate text to N characters. Leave empty for no truncation.
truncate =
# Include timestamps in output (true/false).
timestamps = true
