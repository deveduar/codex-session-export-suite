# Default configuration for Codex Session Exporter.
#
# Precedence: CLI arguments > this file > built-in defaults.
#
# A per-user config can also be created at:
#   Windows: %APPDATA%\codex_exporter\config.ini
#   Linux:   ~/.config/codex_exporter/config.ini
#
# Use another file with: python3 cli.py --config path/to/config.ini

[codex]
# Codex root directory, sessions directory, year/month subdirectory, or a .jsonl file.
# Leave empty to auto-detect CODEX_HOME or ~/.codex.
# Windows example: dir = %USERPROFILE%\.codex
dir =

[output]
# Directory where exported files are written.
dir = ./codex_exports
# Layout: run creates a timestamped folder with product subfolders and indexes;
# flat writes files directly into the output directory.
layout = run

[export]
# Default preset. Leave empty to use the transcript product.
# Presets: archive, source, markdown, conversation, prompts, rag
preset =
# Explicit products, separated by commas or spaces.
# Products: transcript, conversation, memory, faithful
# Example: products = transcript faithful
products =
# Role filter: user, assistant, or both. Leave empty for no filter.
role =
# Keep the first N characters of each message or tool body. Leave empty for no truncation.
truncate =
# Keep the last N user turns, including their assistant and tool events. Leave empty for all turns.
recent_turns =
# Include timestamps in output (true/false).
timestamps = true
# Include the archived_sessions directory when exporting.
include_archived = true
